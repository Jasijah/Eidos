<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#15201f;color:white;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;height:100vh}.shell{text-align:center}.mark{display:grid;width:72px;height:72px;margin:0 auto 20px;place-items:center;border-radius:14px;background:#48b9aa;color:#15201f;font-size:42px;font-weight:800}.title{font-size:28px;font-weight:700}.copy{margin-top:8px;color:rgba(255,255,255,.62);font-size:13px}.bar{width:220px;height:3px;margin:28px auto 0;overflow:hidden;background:rgba(255,255,255,.12)}.bar:after{content:"";display:block;width:45%;height:100%;background:#48b9aa;animation:load 1.2s infinite ease-in-out}@keyframes load{from{transform:translateX(-110%)}to{transform:translateX(330%)}}@media(prefers-reduced-motion:reduce){.bar:after{animation:none;width:100%}}</style></head><body><main class="shell"><div class="mark">E</div><div class="title">Eidos</div><div class="copy">Turn Your Camera Off. Stay Present.</div><div class="bar"></div></main></body></html>
